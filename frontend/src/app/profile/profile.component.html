<app-load-error-state [load]="loadProfile" errorKey="profileLoadError" errorWrapperClass="container my-4">
<div loading class="container mt-4">
  <div class="card mx-auto shadow-sm profile-card" style="max-width: 500px; position: relative; padding-bottom: 20px">
    <div class="card-body text-center">
      <app-skeleton [circle]="true" width="150px" height="150px" class="mb-3 mx-auto" style="display: block"></app-skeleton>
      <app-skeleton width="40%" height="1.6rem" class="mx-auto mb-2" style="display: block"></app-skeleton>
      <app-skeleton width="28%" height="1.15rem" class="mx-auto mb-3" style="display: block"></app-skeleton>
      <hr />
      <app-skeleton width="28%" height="1rem" class="mx-auto mb-3" style="display: block"></app-skeleton>
      <app-skeleton width="22%" height="1rem" class="mx-auto" style="display: block"></app-skeleton>
    </div>
    <div class="text-center">
      <app-skeleton width="160px" height="2.4rem" radius="var(--app-control-radius)" class="mx-auto" style="display: block"></app-skeleton>
    </div>
  </div>
</div>

<div *ngIf="userProfile" class="container mt-4">
  <div
    class="card mx-auto shadow-sm profile-card"
    style="max-width: 500px; position: relative; padding-bottom: 20px"
  >
    <div class="card-body text-center">
      <h2 class="text-center mb-4">{{ 'profile' | translate }}</h2>
      <div
        class="rounded-circle mb-3 mx-auto"
        style="
          width: 150px;
          height: 150px;
          background-color: #e9ecef;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <ng-container *ngIf="userProfile.profilePictureUrl; else defaultImage">
          <img
            [src]="userProfile.profilePictureUrl + '?t=' + timestamp"
            (error)="handleImageError()"
            [alt]="'profilePicture' | translate"
            style="width: 100%; height: 100%; object-fit: cover"
          />
        </ng-container>
        <ng-template #defaultImage>
          <div class="d-flex flex-column align-items-center">
            <i class="bi bi-camera"></i>
            <span>{{ 'profilePicture' | translate }}</span>
          </div>
        </ng-template>
      </div>

      <h2 class="fw-bold">{{ userProfile.username }}</h2>
      <p class="h5 text-secondary mb-3">
        {{ userProfile.fullName }}
      </p>
      <hr />
      <p class="mb-3">
        <i class="bi bi-geo-alt-fill me-2"></i>
        {{ userProfile.location ? userProfile.location : ('notSet' | translate) }}
      </p>
      <p class="mb-3">
        <i class="bi bi-telephone-fill me-2"></i>
        {{ userProfile.phoneNumber ? userProfile.phoneNumber : ('notSet' | translate) }}
      </p>
    </div>
    <div class="text-center">
      <button
        type="button"
        class="btn btn-primary"
        routerLink="/profile/edit"
      >
        <i class="bi bi-pencil me-1"></i> {{ 'editProfile' | translate }}
      </button>
    </div>
  </div>
</div>
</app-load-error-state>
