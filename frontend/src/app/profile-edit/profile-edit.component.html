<app-navbar></app-navbar>
<div class="container mt-4">
  <div class="card mx-auto shadow-sm profile-edit-card" style="max-width: 600px">
    <div class="card-body" *ngIf="isLoading">
      <h3 class="card-title text-center mb-4">{{ 'editProfile' | translate }}</h3>
      <app-skeleton [circle]="true" width="150px" height="150px" class="mb-4 mx-auto" style="display: block"></app-skeleton>
      <app-skeleton width="100%" height="3.3rem" radius="var(--app-control-radius)" class="mb-3" style="display: block"></app-skeleton>
      <app-skeleton width="100%" height="3.3rem" radius="var(--app-control-radius)" class="mb-3" style="display: block"></app-skeleton>
      <app-skeleton width="100%" height="3.3rem" radius="var(--app-control-radius)" class="mb-4" style="display: block"></app-skeleton>
      <app-skeleton width="160px" height="2.4rem" radius="var(--app-control-radius)" class="mx-auto" style="display: block"></app-skeleton>
    </div>

    <div class="card-body" *ngIf="!isLoading">
      <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
      <h3 class="card-title text-center mb-4">{{ 'editProfile' | translate }}</h3>

      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="mb-3 text-center">
          <label for="profilePicture" class="form-label">{{ 'profilePicture' | translate }}</label>
          <div class="mb-2">
            <ng-container *ngIf="!previewUrl; else imgPreview">
              <div
                class="rounded-circle bg-light d-flex align-items-center justify-content-center"
                style="
                  width: 150px;
                  height: 150px;
                  border: 2px dashed #ccc;
                  cursor: pointer;
                  margin: 0 auto;
                "
              >
                <i class="bi bi-camera" style="font-size: 2rem"></i>
              </div>
            </ng-container>

            <ng-template #imgPreview>
              <div class="position-relative">
                <img
                  [src]="previewUrl"
                  [alt]="'profilePicture' | translate"
                  class="rounded-circle"
                  style="width: 150px; height: 150px; object-fit: cover"
                  (error)="handleImageError()"
                />
                <button
                  type="button"
                  class="btn btn-sm position-absolute top-0 end-0 mt-1 me-1"
                  style="background-color: #e4e4e4"
                  [disabled]="isRemovingPicture"
                  (click)="removeProfilePicture()"
                  [title]="'removeProfilePicture' | translate"
                >
                  <span *ngIf="isRemovingPicture" class="spinner-border spinner-border-sm" role="status"></span>
                  <i *ngIf="!isRemovingPicture" class="bi bi-trash" style="color: #585858"></i>
                </button>
              </div>
            </ng-template>
          </div>

          <input
            type="file"
            id="profilePicture"
            (change)="onFileSelected($event)"
            class="form-control"
          />
          <div *ngIf="fileError" class="text-danger mt-2">{{ fileError }}</div>
        </div>

        <div class="mb-3 form-floating">
          <input
            type="text"
            id="fullName"
            formControlName="fullName"
            class="form-control"
            [placeholder]="'fullName' | translate"
          />
          <label for="fullName">{{ 'fullName' | translate }}</label>
          <div
            *ngIf="
              editForm.get('fullName')?.invalid &&
              editForm.get('fullName')?.touched
            "
            class="text-danger"
          >
            {{ 'requiredField' | translate }}
          </div>
        </div>

        <div class="mb-3 position-relative form-floating">
          <input
            type="text"
            id="location"
            formControlName="location"
            class="form-control"
            [placeholder]="'location' | translate"
            (focus)="showDropdown = true"
          />
          <label for="location">{{ 'location' | translate }}</label>

          <ul
            *ngIf="showDropdown && (filteredCities$ | async)?.length"
            class="list-group position-absolute w-100"
            style="z-index: 1000"
          >
            <li
              class="list-group-item list-group-item-action"
              *ngFor="let city of filteredCities$ | async"
              (click)="selectCity(city)"
            >
              {{ city.name }}, {{ city.canton }}
            </li>
          </ul>
        </div>

        <div class="mb-3 form-floating">
          <input
            type="text"
            id="phoneNumber"
            formControlName="phoneNumber"
            class="form-control"
            placeholder="{{ 'phoneNumber' | translate }}"
          />
          <label for="phoneNumber">{{ 'phoneNumber' | translate }}</label>
          <div
            *ngIf="
              editForm.get('phoneNumber')?.errors &&
              editForm.get('phoneNumber')?.touched
            "
            class="text-danger"
          >
            <div *ngIf="editForm.get('phoneNumber')?.errors?.['required']">
              {{ 'requiredField' | translate }}
            </div>
            <div *ngIf="editForm.get('phoneNumber')?.errors?.['pattern']">
              {{ 'wrongPhoneFormat' | translate }}
            </div>
          </div>
        </div>

        <div class="text-center">
          <button
            type="submit"
            class="btn btn-primary mb-2"
            [disabled]="editForm.pristine || editForm.invalid || isSaving"
          >
            <span *ngIf="!isSaving">{{ 'saveChanges' | translate }}</span>
            <span *ngIf="isSaving">
              <span class="spinner-border spinner-border-sm me-2" role="status"></span>
              {{ 'savingChanges' | translate }}
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
