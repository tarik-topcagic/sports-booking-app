<main class="messages-page">
  <div class="container">
    <section class="messages-shell">
      <div class="messages-title">
        <p class="section-label">{{ 'messages' | translate }}</p>
        <h1>{{ 'messages' | translate }}</h1>
      </div>

      <app-load-error-state [load]="loadMessages" errorKey="messagesLoadError" errorWrapperClass="my-4">
      <div loading class="messages-list">
        <app-skeleton-list-item
          *ngFor="let placeholder of [1, 2, 3, 4]"
          variant="card"
          avatarShape="circle"
          avatarSize="38px"
          [lineWidths]="['85%', '25%']"
          [actionCount]="0"
        ></app-skeleton-list-item>
      </div>

      <div *ngIf="!messages.length" class="status-message">
        {{ 'noMessageNotifications' | translate }}
      </div>

      <div *ngIf="messages.length" class="messages-list">
        <article
          class="message-card"
          *ngFor="let message of messages"
          [class.unread]="hasUnreadMessages(message)"
          [class.new-message]="isHighlightedMessage(message)"
          (click)="openMessage(message)"
        >
          <div class="message-avatar">
            <ng-container *ngIf="message.imageUrl && message.imageUrl !== 'default-group.png' && message.imageUrl !== 'default-profile.png'; else defaultGroupAvatar">
              <img [src]="message.imageUrl" [alt]="message.title" class="avatar-image" />
            </ng-container>
            <ng-template #defaultGroupAvatar>
              <div class="default-avatar">
                <i class="bi" [ngClass]="message.fallbackIcon"></i>
              </div>
            </ng-template>
            <span *ngIf="shouldShowPresenceDot(message)" class="message-presence-dot"></span>
          </div>

          <div class="message-content">
            <div class="message-topline">
              <strong class="group-name">{{ message.title }}</strong>
              <span *ngIf="message.unreadCount" class="message-unread-count">{{ message.unreadCount }}</span>
            </div>

            <p *ngIf="message.subtitle" class="sender-name">{{ message.subtitle }}</p>
            <p class="message-preview">{{ getMessagePreview(message) }}</p>
            <span class="message-time">{{ message.createdAt | liveRelativeTime:true }}</span>
          </div>
        </article>
      </div>
      </app-load-error-state>
    </section>
  </div>
</main>
