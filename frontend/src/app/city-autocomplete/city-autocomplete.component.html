<app-searchable-dropdown
  [id]="id"
  [items]="cities"
  [itemsLoaded]="citiesLoaded"
  [itemLabel]="itemLabel"
  [matchValue]="matchValue"
  [filterPredicate]="filterPredicate"
  [placeholder]="'groupCity' | translate"
  [loadingText]="'loading' | translate"
  [noResultsText]="'noCitiesFound' | translate"
  [disabled]="disabled"
  (itemSelected)="onCitySelected($event)"
  (selectionCleared)="onSelectionCleared()"
  (blurred)="onTouchedHandler()"
></app-searchable-dropdown>
