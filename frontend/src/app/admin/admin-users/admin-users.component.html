<app-navbar></app-navbar>
<div class="container admin-page">
  <h1 class="mb-4">Users</h1>

  <form class="row g-2 align-items-end mb-4" (ngSubmit)="applyFilters()">
    <div class="col-auto">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="filterUsername" [(ngModel)]="filterUsername" />
    </div>
    <div class="col-auto">
      <label class="form-label">Role</label>
      <app-admin-select name="filterRole" [(ngModel)]="filterRole" [options]="roleOptions"></app-admin-select>
    </div>
    <div class="col-auto">
      <label class="form-label">Status</label>
      <app-admin-select name="filterLocked" [(ngModel)]="filterLocked" [options]="lockedOptions"></app-admin-select>
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary">Filter</button>
    </div>
    <div class="col-auto">
      <button type="button" class="btn btn-outline-secondary" (click)="clearFilters()">Clear</button>
    </div>
  </form>

  <app-load-error-state #usersState [load]="loadUsers" errorText="Failed to load users." [retryLabel]="'Retry'" errorWrapperClass="my-4"></app-load-error-state>

  <div class="table-responsive" *ngIf="!usersState.hasError">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>User ID</th>
          <th>Full name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Roles</th>
          <th>Status</th>
          <th>Created At</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="isLoading">
          <tr app-skeleton-row *ngFor="let placeholder of [1, 2, 3, 4, 5, 6]" [columnCount]="8"></tr>
        </ng-container>
        <ng-container *ngIf="!isLoading">
          <tr *ngFor="let user of pagedUsers">
            <td>{{ user.id }}</td>
            <td>{{ user.fullName }}</td>
            <td>{{ user.userName || '-' }}</td>
            <td>{{ user.email || '-' }}</td>
            <td>
              <span class="badge text-bg-secondary me-1" *ngFor="let role of user.roles">{{ role }}</span>
              <span *ngIf="!user.roles.length" class="text-muted">-</span>
            </td>
            <td>
              <span class="badge" [class.text-bg-danger]="isLocked(user)" [class.text-bg-success]="!isLocked(user)">
                {{ isLocked(user) ? 'Locked' : 'Active' }}
              </span>
            </td>
            <td>{{ user.createdAt ? (user.createdAt | date: 'short') : '-' }}</td>
            <td>
              <button
                type="button"
                class="btn btn-sm"
                [class.btn-outline-danger]="!isLocked(user)"
                [class.btn-outline-success]="isLocked(user)"
                [disabled]="isPending(user) || (!isLocked(user) && isSelf(user))"
                [title]="!isLocked(user) && isSelf(user) ? 'You cannot lock your own account' : ''"
                (click)="toggleLock(user)"
              >
                <span *ngIf="isPending(user)" class="spinner-border spinner-border-sm" role="status"></span>
                <span *ngIf="!isPending(user)">{{ isLocked(user) ? 'Unlock' : 'Lock' }}</span>
              </button>
            </td>
          </tr>
          <tr *ngIf="!users.length">
            <td colspan="8" class="text-center text-muted">No users found.</td>
          </tr>
        </ng-container>
      </tbody>
    </table>

    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [totalPagesArray]="totalPagesArray"
      ariaLabel="Users pagination"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </div>
</div>
